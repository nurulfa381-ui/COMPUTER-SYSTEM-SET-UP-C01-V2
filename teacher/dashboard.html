<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Guru C01</title><link rel="stylesheet" href="style.css?v=1"></head>
<body><main class="page">
<header class="panel header"><div><p class="eyebrow">TEACHER MODULE • C01</p><h1>DASHBOARD PEGAWAI PENILAI</h1><p id="teacherGreeting" class="muted"></p></div>
<div class="actions"><button onclick="location.href='penilaian.html'">PENILAIAN</button><button onclick="location.href='laporan.html'">LAPORAN</button><button onclick="location.href='tetapan.html'">TETAPAN</button><button class="danger" onclick="logoutTeacher()">LOG KELUAR</button></div></header>
<section class="stats-grid"><article class="stat-card"><span>Pelatih Dikesan</span><strong id="studentCount">0</strong></article><article class="stat-card"><span>Menunggu</span><strong id="pendingCount">0</strong></article><article class="stat-card"><span>Terampil</span><strong id="competentCount">0</strong></article><article class="stat-card"><span>Belum Terampil</span><strong id="notCompetentCount">0</strong></article></section>
<section class="panel"><div class="section-head"><div><p class="eyebrow">RINGKASAN</p><h2>STATUS KT13, KT14 DAN KT15</h2></div><button onclick="refreshDashboard()">MUAT SEMULA</button></div><div id="summaryTable"></div>
<div class="warning-box">Modul ini membaca data localStorage pada peranti yang sama. Data pelatih daripada peranti lain tidak akan muncul tanpa Firebase atau pangkalan data.</div></section>
</main><script src="teacher-storage.js?v=1"></script><script src="teacher.js?v=1"></script>
<script>
document.addEventListener("DOMContentLoaded",refreshDashboard);
function refreshDashboard(){
 const teacher=C01TeacherStorage.requireSession();teacherGreeting.textContent=`Selamat datang, ${teacher.name}`;
 const r=C01TeacherStorage.collectAllRecords();
 studentCount.textContent=r.length;pendingCount.textContent=r.filter(x=>x.status==="MENUNGGU PENGESAHAN").length;
 competentCount.textContent=r.filter(x=>x.status==="TERAMPIL").length;notCompetentCount.textContent=r.filter(x=>x.status==="BELUM TERAMPIL").length;
 summaryTable.innerHTML=C01TeacherUI.renderRecordTable(r,false);
}
function logoutTeacher(){C01TeacherStorage.clearSession();location.href="login.html";}
</script></body></html>
