<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Login Pegawai Penilai C01</title>
  <link rel="stylesheet" href="style.css?v=20260804-1">
</head>
<body>
  <main class="center-page">
    <section class="panel login-panel">
      <p class="eyebrow">FIREBASE TEACHER MODULE • C01</p>
      <h1>LOGIN PEGAWAI PENILAI</h1>
      <p class="muted">Masukkan nama dan PIN guru.</p>

      <label>
        Nama Pegawai Penilai
        <input id="teacherName" type="text" placeholder="Masukkan nama penuh" autocomplete="name">
      </label>

      <label>
        PIN Guru
        <input id="teacherPin" type="password" inputmode="numeric" placeholder="Masukkan PIN">
      </label>

      <p id="loginMessage" class="message"></p>

      <button id="loginButton" class="primary full" type="button">LOG MASUK</button>
      <button class="secondary full" type="button" onclick="location.href='../index.html'">KEMBALI</button>

      <div class="info-box">
        PIN awal: <strong>1515</strong>
      </div>
    </section>
  </main>

  <script type="module">
    import {
      ensureFirebaseLogin
    } from "../firebase-config.js?v=20260804-1";

    const PIN_KEY = "c01_teacher_pin_v2";
    const SESSION_KEY = "c01_teacher_session_v2";

    const nameInput = document.getElementById("teacherName");
    const pinInput = document.getElementById("teacherPin");
    const message = document.getElementById("loginMessage");
    const button = document.getElementById("loginButton");

    button.addEventListener("click", loginTeacher);

    pinInput.addEventListener("keydown", event => {
      if (event.key === "Enter") loginTeacher();
    });

    async function loginTeacher() {
      const name = nameInput.value.trim();
      const pin = pinInput.value.trim();
      const savedPin = localStorage.getItem(PIN_KEY) || "1515";

      message.textContent = "";

      if (!name || !pin) {
        message.textContent = "Sila masukkan nama dan PIN.";
        return;
      }

      if (pin !== savedPin) {
        message.textContent = "PIN tidak tepat.";
        return;
      }

      button.disabled = true;
      button.textContent = "SEDANG MENYAMBUNG...";

      try {
        const user = await ensureFirebaseLogin();

        sessionStorage.setItem(
          SESSION_KEY,
          JSON.stringify({
            name,
            uid: user.uid,
            loginAt: new Date().toISOString()
          })
        );

        location.href = "dashboard.html";
      } catch (error) {
        console.error(error);
        message.textContent = "Sambungan Firebase gagal. Cuba semula.";
        button.disabled = false;
        button.textContent = "LOG MASUK";
      }
    }
  </script>
</body>
</html>
