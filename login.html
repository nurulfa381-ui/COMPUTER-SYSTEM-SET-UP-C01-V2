<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5"
  >

  <meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
  >

  <meta
    http-equiv="Pragma"
    content="no-cache"
  >

  <meta
    http-equiv="Expires"
    content="0"
  >

  <title>Login Pelatih C01 – KP13 & KT13</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg-dark: #020712;
      --bg-mid: #08243c;
      --panel: #0d2f4c;
      --panel-light: #123d5f;
      --text: #ffffff;
      --muted: #e7f0f7;
      --blue: #38bdf8;
      --orange: #fbbf24;
      --green: #34d399;
      --red: #fb7185;
      --border: #5a86aa;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family: "Poppins", Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 8%,
          rgba(56, 189, 248, 0.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(251, 191, 36, 0.15),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          var(--bg-dark),
          var(--bg-mid)
        );
    }

    h1,
    h2,
    h3,
    strong {
      font-family: "Montserrat", Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: min(760px, 100%);
      padding: 34px;

      border: 2px solid var(--border);
      border-radius: 28px;

      background:
        linear-gradient(
          145deg,
          rgba(18, 61, 95, 0.98),
          rgba(7, 28, 46, 0.98)
        );

      box-shadow:
        0 28px 80px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      margin: 0;
      color: #7dd3fc;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 10px 0 4px;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.05;
    }

    .subtitle {
      margin-bottom: 26px;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.6;
    }

    .field-group {
      margin-top: 18px;
    }

    .field-group label {
      display: block;
      margin-bottom: 8px;
      color: #ffffff;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;

      border: 2px solid var(--border);
      border-radius: 14px;

      color: #ffffff;
      background: #071c2e;
      outline: none;

      pointer-events: auto;
      touch-action: manipulation;

      -webkit-user-select: text;
      user-select: text;

      font-size: 16px;
    }

    input:focus {
      border-color: var(--orange);

      box-shadow:
        0 0 0 4px rgba(251, 191, 36, 0.18);
    }

    input::placeholder {
      color: #b9c9d8;
      opacity: 1;
    }

    fieldset {
      margin-top: 22px;
      padding: 18px;

      border: 2px solid var(--border);
      border-radius: 16px;
    }

    legend {
      padding: 0 8px;
      color: #ffffff;
      font-weight: 800;
    }

    .avatar-grid {
      display: grid;
      grid-template-columns:
        repeat(6, minmax(0, 1fr));

      gap: 10px;
    }

    .avatar-button {
      min-height: 66px;

      border: 2px solid var(--border);
      border-radius: 14px;

      color: #ffffff;
      background: var(--panel-light);

      font-size: 2rem;
    }

    .avatar-button.selected {
      border-color: var(--orange);
      background: #1a4e76;

      box-shadow:
        0 0 0 4px rgba(251, 191, 36, 0.17);
    }

    .message {
      min-height: 30px;
      margin: 16px 0 0;
      font-weight: 700;
    }

    .message.error {
      color: var(--red);
    }

    .message.success {
      color: var(--green);
    }

    .message.loading {
      color: var(--orange);
    }

    .button-row {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .primary-button,
    .secondary-button {
      width: 100%;
      min-height: 58px;

      border-radius: 15px;
      padding: 14px 20px;

      font-weight: 800;
    }

    .primary-button {
      border: 0;
      color: #111827;

      background:
        linear-gradient(
          135deg,
          #fde68a,
          var(--orange)
        );
    }

    .primary-button:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .secondary-button {
      border: 2px solid #60a5fa;
      color: #ffffff;
      background: #1d4ed8;
    }

    .firebase-status {
      margin-top: 20px;
      padding: 15px;

      border-left: 7px solid var(--green);
      border-radius: 14px;

      color: #ffffff;

      background:
        rgba(52, 211, 153, 0.12);

      line-height: 1.6;
    }

    @media (max-width: 720px) {
      .page {
        display: block;
        padding: 12px;
      }

      .login-card {
        margin: 10px auto;
        padding: 22px;
      }

      .avatar-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <section class="login-card">

      <p class="eyebrow">
        COMPUTER SYSTEM SET-UP • C01
      </p>

      <h1>
        LOGIN PELATIH
      </h1>

      <p class="subtitle">
        Masukkan nama penuh dan ID pelatih sebelum memulakan
        KP13 dan KT13.
      </p>

      <form
        id="loginForm"
        autocomplete="on"
        novalidate
      >

        <div class="field-group">

          <label for="studentName">
            Nama Penuh Pelatih
          </label>

          <input
            id="studentName"
            name="studentName"
            type="text"
            placeholder="Contoh: Ahmad Bin Ali"
            autocomplete="name"
            autocapitalize="words"
            enterkeyhint="next"
            inputmode="text"
            required
          >

        </div>

        <div class="field-group">

          <label for="studentId">
            ID Pelatih / No. Kad Pengenalan
          </label>

          <input
            id="studentId"
            name="studentId"
            type="text"
            placeholder="Masukkan ID pelatih"
            autocomplete="off"
            autocapitalize="characters"
            enterkeyhint="done"
            inputmode="text"
            required
          >

        </div>

        <fieldset>

          <legend>
            Pilih Avatar
          </legend>

          <div class="avatar-grid">

            <button
              class="avatar-button selected"
              type="button"
              data-avatar="🧑‍💻"
            >
              🧑‍💻
            </button>

            <button
              class="avatar-button"
              type="button"
              data-avatar="👩‍💻"
            >
              👩‍💻
            </button>

            <button
              class="avatar-button"
              type="button"
              data-avatar="🧑‍🔧"
            >
              🧑‍🔧
            </button>

            <button
              class="avatar-button"
              type="button"
              data-avatar="👩‍🔧"
            >
              👩‍🔧
            </button>

            <button
              class="avatar-button"
              type="button"
              data-avatar="🤖"
            >
              🤖
            </button>

            <button
              class="avatar-button"
              type="button"
              data-avatar="🦸"
            >
              🦸
            </button>

          </div>

        </fieldset>

        <p
          id="loginMessage"
          class="message"
          aria-live="polite"
        ></p>

        <div class="button-row">

          <button
            id="loginButton"
            class="primary-button"
            type="submit"
          >
            SIMPAN DAN MASUK DASHBOARD
          </button>

          <button
            class="secondary-button"
            type="button"
            onclick="window.location.href='index.html'"
          >
            KEMBALI KE HALAMAN UTAMA
          </button>

        </div>

      </form>

      <div class="firebase-status">
        ☁️ Nama dan ID pelatih akan dihantar ke Firebase supaya
        Pegawai Penilai boleh melihat rekod daripada peranti lain.
      </div>

    </section>

  </main>

  <script type="module">
    import {
      db,
      ensureFirebaseLogin,
      serverTimestamp
    } from "./firebase-config.js?v=20260804-1";

    import {
      doc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

    const LOCAL_PROFILE_KEY =
      "c01_student_profile";

    let selectedAvatar =
      "🧑‍💻";

    const loginForm =
      document.getElementById(
        "loginForm"
      );

    const loginButton =
      document.getElementById(
        "loginButton"
      );

    const loginMessage =
      document.getElementById(
        "loginMessage"
      );

    document.addEventListener(
      "DOMContentLoaded",
      function () {
        initialiseAvatarButtons();
        restoreLocalProfile();
      }
    );

    function initialiseAvatarButtons() {
      const buttons =
        document.querySelectorAll(
          ".avatar-button"
        );

      buttons.forEach(function (button) {
        button.addEventListener(
          "click",
          function () {
            buttons.forEach(function (item) {
              item.classList.remove(
                "selected"
              );
            });

            button.classList.add(
              "selected"
            );

            selectedAvatar =
              button.dataset.avatar;
          }
        );
      });
    }

    function restoreLocalProfile() {
      try {
        const profile =
          JSON.parse(
            localStorage.getItem(
              LOCAL_PROFILE_KEY
            ) || "null"
          );

        if (!profile) {
          return;
        }

        document
          .getElementById(
            "studentName"
          )
          .value =
          profile.name || "";

        document
          .getElementById(
            "studentId"
          )
          .value =
          profile.id || "";

        selectedAvatar =
          profile.avatar || "🧑‍💻";

        document
          .querySelectorAll(
            ".avatar-button"
          )
          .forEach(function (button) {
            button.classList.toggle(
              "selected",
              button.dataset.avatar ===
                selectedAvatar
            );
          });
      } catch (error) {
        console.error(
          "Profil tempatan tidak dapat dibaca:",
          error
        );
      }
    }

    loginForm.addEventListener(
      "submit",
      async function (event) {
        event.preventDefault();

        await loginStudent();
      }
    );

    async function loginStudent() {
      const name =
        document
          .getElementById(
            "studentName"
          )
          .value
          .trim();

      const studentId =
        document
          .getElementById(
            "studentId"
          )
          .value
          .trim();

      clearMessage();

      if (!name) {
        showMessage(
          "Sila masukkan nama penuh pelatih.",
          "error"
        );

        document
          .getElementById(
            "studentName"
          )
          .focus();

        return;
      }

      if (!studentId) {
        showMessage(
          "Sila masukkan ID pelatih.",
          "error"
        );

        document
          .getElementById(
            "studentId"
          )
          .focus();

        return;
      }

      setLoading(true);

      try {
        showMessage(
          "Sedang menyambung ke Firebase...",
          "loading"
        );

        const firebaseUser =
          await ensureFirebaseLogin();

        const previousProfile =
          readLocalProfile();

        const localProfile = {
          name,
          id: studentId,
          avatar: selectedAvatar,
          language: "ms",

          xp:
            Number(
              previousProfile?.xp || 50
            ),

          coins:
            Number(
              previousProfile?.coins || 0
            ),

          unlocked:
            Math.max(
              Number(
                previousProfile?.unlocked || 13
              ),
              13
            ),

          completed:
            Array.isArray(
              previousProfile?.completed
            )
              ? previousProfile.completed
              : [],

          scores:
            previousProfile?.scores || {},

          attempts:
            previousProfile?.attempts || {},

          pendingAssessments:
            previousProfile
              ?.pendingAssessments || {},

          officialMarks:
            previousProfile
              ?.officialMarks || {},

          badges:
            Array.isArray(
              previousProfile?.badges
            )
              ? previousProfile.badges
              : ["first-login"],

          firebaseUid:
            firebaseUser.uid,

          updatedAt:
            new Date().toISOString()
        };

        localStorage.setItem(
          LOCAL_PROFILE_KEY,
          JSON.stringify(
            localProfile
          )
        );

        await setDoc(
          doc(
            db,
            "students",
            firebaseUser.uid
          ),
          {
            uid:
              firebaseUser.uid,

            name,
            studentId,
            avatar:
              selectedAvatar,

            module:
              "C01",

            currentMission:
              13,

            repository:
              "COMPUTER-SYSTEM-SET-UP-C01-V2",

            xp:
              localProfile.xp,

            coins:
              localProfile.coins,

            device:
              getDeviceType(),

            browser:
              navigator.userAgent,

            lastLogin:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()
          },
          {
            merge: true
          }
        );

        showMessage(
          "Login berjaya. Membuka dashboard...",
          "success"
        );

        window.setTimeout(
          function () {
            window.location.href =
              "dashboard.html";
          },
          600
        );
      } catch (error) {
        console.error(
          "Firebase login gagal:",
          error
        );

        let message =
          "Login Firebase gagal. Sila cuba semula.";

        if (
          error.code ===
          "auth/operation-not-allowed"
        ) {
          message =
            "Anonymous Authentication belum diaktifkan dalam Firebase.";
        }

        if (
          error.code ===
          "permission-denied"
        ) {
          message =
            "Firestore Rules tidak membenarkan data disimpan.";
        }

        if (
          error.code ===
          "auth/network-request-failed"
        ) {
          message =
            "Sambungan Internet bermasalah. Sila cuba semula.";
        }

        showMessage(
          message,
          "error"
        );

        setLoading(false);
      }
    }

    function readLocalProfile() {
      try {
        return JSON.parse(
          localStorage.getItem(
            LOCAL_PROFILE_KEY
          ) || "null"
        );
      } catch (error) {
        return null;
      }
    }

    function getDeviceType() {
      const agent =
        navigator.userAgent.toLowerCase();

      if (
        agent.includes("ipad")
      ) {
        return "iPad";
      }

      if (
        agent.includes("iphone")
      ) {
        return "iPhone";
      }

      if (
        agent.includes("android") &&
        !agent.includes("mobile")
      ) {
        return "Tablet Android";
      }

      if (
        agent.includes("android")
      ) {
        return "Telefon Android";
      }

      return "Komputer";
    }

    function showMessage(
      message,
      type
    ) {
      loginMessage.textContent =
        message;

      loginMessage.className =
        `message ${type}`;
    }

    function clearMessage() {
      loginMessage.textContent = "";
      loginMessage.className =
        "message";
    }

    function setLoading(isLoading) {
      loginButton.disabled =
        isLoading;

      loginButton.textContent =
        isLoading
          ? "SEDANG MENYIMPAN..."
          : "SIMPAN DAN MASUK DASHBOARD";
    }
  </script>
</body>
</html>
